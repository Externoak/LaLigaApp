services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: laligaapp-backend:latest
    restart: unless-stopped
    networks:
      - internal
    environment:
      - APP_PORT=3005
      # The server defaults to loopback-only + strict origins; inside the
      # container it must listen on the bridge network for nginx, and accept
      # whatever public origin the frontend is served from. The backend is not
      # published to the host, so this stays contained to the internal network.
      - APP_HOST=0.0.0.0
      - APP_ALLOWED_ORIGINS=*
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://0.0.0.0:3005/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: laligaapp-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    ports:
      # nginx runs unprivileged and listens on 8080 inside the container
      - "80:8080"

networks:
  internal:
    driver: bridge