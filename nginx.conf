server {
   listen 8080;
   root /usr/share/nginx/html;
   index index.html;

   server_tokens off;

   # Security headers
   add_header X-Frame-Options "SAMEORIGIN" always;
   add_header X-Content-Type-Options "nosniff" always;
   add_header X-XSS-Protection "1; mode=block" always;
   # Same policy the Node server applies to builds it serves (server/index.js);
   # no localhost entries here because /api/ is proxied same-origin below.
   add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://fantasy-api.llt-services.com https://login.laliga.es https://raw.githubusercontent.com https://github.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; worker-src 'self'" always;

   # Gzip compression
   gzip on;
   gzip_comp_level 6;
   gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml font/woff2 font/woff;

   location /api/ {
     proxy_pass http://backend:3005;
     proxy_set_header Host $host;
     proxy_set_header X-Real-IP $remote_addr;
     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
     proxy_set_header X-Forwarded-Proto $scheme;
   }

    # CRA emite nombres con hash de contenido: cachear un año. Se usa
    # `expires` y no `add_header Cache-Control`, porque un add_header dentro
    # de un location descarta los heredados (perderíamos la CSP de arriba).
    location /static/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        # index.html no se cachea: es el puntero a los assets con hash.
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
